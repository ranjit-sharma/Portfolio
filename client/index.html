    <!-- Prevent theme flash: synchronously apply saved theme & accent color -->
    <script>
      (function() {
        var savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
        var savedColor = localStorage.getItem('portfolio-color');
        if (savedColor === 'rose') {
          savedColor = 'red';
          localStorage.setItem('portfolio-color', 'red');
        }
        if (savedColor === 'violet') {
          savedColor = 'green';
          localStorage.setItem('portfolio-color', 'green');
        }
        document.documentElement.setAttribute('data-color', savedColor || 'emerald');
      })();
    </script>
